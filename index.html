<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Officina</title>
    <meta
      name="description"
      content="Officina: an index of open-source tools by Anton Soloviev, AI/ML engineer."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23F3EFE7'/%3E%3Crect x='1' y='1' width='22' height='22' fill='none' stroke='%238B1E1E' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%23B08D3E'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("officina-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* storage unavailable */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <noscript>
        <p style="max-width: 40em; margin: 4em auto; font-family: serif; text-align: center">
          Officina needs JavaScript to list the projects. Visit
          <a href="https://github.com/antonsoo">github.com/antonsoo</a> directly in the meantime.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
